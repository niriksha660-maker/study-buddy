<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1226">
<title>Study Buddy — Offline</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0f1226 0%, #1a1f4a 55%, #0f1226 100%);
    color: #e8eaff;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
  }
  .icon { font-size: 72px; margin-bottom: 12px; }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: 0.5px; }
  p { color: #9aa3d8; line-height: 1.6; margin: 0 0 24px; }
  button {
    background: #6c5ce7;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  button:hover { background: #8474ff; transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📚</div>
    <h1>You're offline</h1>
    <p>Study Buddy can't reach the internet right now. Your saved tasks are safe on this device — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
