document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  switch(act){
    // tasks
    case 'toggle-task': { const t = state.tasks.find(x=>x.id===id); if (t){ t.done = !t.done; save(); render(); } break; }
    case 'del-task': state.tasks = state.tasks.filter(x=>x.id!==id); save(); render(); break;
    case 'add-task-modal': addTaskModal(); break;
    case 'save-task': {
      const title = $('#m-title').value.trim(); if (!title){ toast('Give it a title'); return; }
      state.tasks.push({ id:uid(), subjectId:$('#m-subject').value, title, date:$('#m-date').value||todayISO(),
        minutes:+$('#m-minutes').value||25, done:false, source:'manual' });
      save(); closeModal(); render(); toast('Task added ✓'); break; }
    case 'regen-today': case 'gen-plan': { const r = buildPlan(); toast(r.note); render(); break; }
    case 'clear-day': {
      const d = el.dataset.date;
      state.tasks = state.tasks.filter(x => !(x.date===d && !x.done)); save(); render(); break; }
    case 'pomo-with-task': {
      const task = state.tasks.find(x=>x.id===id); if (!task) break;
      state.pomo.subjectId = task.subjectId; state.pomo.taskId = task.id;
      state.pomo.mode='focus'; state.pomo.remainingMs = pomoDuration('focus'); state.pomo.endsAt=null;
      setView('pomodoro'); pomoStart(); break; }
    case 'start-recommended': {
      if (!state.subjects.length){ setView('subjects'); break; }
      if (cardsDueCount()){ const first = dueCountBySubject()[0]; if (first){ startStudy(first.deck.id, true); toast('Clearing recall backlog first 🧠'); break; } }
      const ctx = coachContext(); const s = ctx.subjects[0]; const topic = nextTopic(s);
      if (!topic){ setView('flashcards'); break; }
      state.tasks.push({ id:uid(), subjectId:s.id, title:`Study: ${topic.name}`, date:todayISO(), minutes:state.settings.focusMin, done:false, source:'manual', topicId:topic.id });
      save();
      const task = state.tasks[state.tasks.length-1];
      state.pomo.subjectId = s.id; state.pomo.taskId = task.id;
      state.pomo.mode='focus'; state.pomo.remainingMs = pomoDuration('focus'); state.pomo.endsAt=null;
      setView('pomodoro'); pomoStart(); break; }
    // subjects & topics
    case 'add-subject-modal': subjectModal(); break;
    case 'edit-exams': openExamDatesModal(); break;
    case 'quick-add-subject': {
      const name = $('#m-xname')?.value.trim();
      if (!name){ toast('Give the subject a name'); $('#m-xname')?.focus(); break; }
      const color = SUBJECT_COLORS.find(c => !state.subjects.some(s => s.color === c)) || SUBJECT_COLORS[0];
      state.subjects.push({ id:uid(), name, color, examDate: $('#m-xdate')?.value || null, confidence:3, weight:2, topics:[] });
      save(); render();
      toast(`Added ${name} — add its topics so the planner can schedule it`);
      openExamDatesModal(); // refresh rows, stay in the editor
      break; }
    case 'remove-subject': {
      const s = subjById(id); if (!s) break;
      if (!confirm(`Remove "${s.name}" and everything linked to it (tasks, decks, doubts)?`)) break;
      state.subjects = state.subjects.filter(x=>x.id!==id);
      state.tasks = state.tasks.filter(t=>t.subjectId!==id);
      state.decks = state.decks.filter(d=>d.subjectId!==id);
      state.doubts = (state.doubts||[]).filter(x=>x.subjectId!==id);
      save(); render();
      toast(`Removed ${s.name} ✓`);
      openExamDatesModal(); // rebuild rows, stay in the editor
      break; }
    case 'subject-detail': subjectDetailModal(id); break;
    case 'detail-start-focus': {
      const s = subjById(id); if (!s) break;
      const topic = nextTopic(s);
      if (topic){
        state.tasks.push({ id:uid(), subjectId:s.id, title:`Study: ${topic.name}`, date:todayISO(), minutes:state.settings.focusMin, done:false, source:'manual', topicId:topic.id });
        save();
        state.pomo.taskId = state.tasks[state.tasks.length-1].id;
      } else state.pomo.taskId = null;
      state.pomo.subjectId = s.id; state.pomo.mode='focus';
      state.pomo.remainingMs = pomoDuration('focus'); state.pomo.endsAt = null;
      closeModal(); setView('pomodoro'); pomoStart(); break; }
    case 'detail-study-cards': {
      const nowTs = Date.now();
      const dk = state.decks.filter(x=>x.subjectId===id)
        .map(x=>({ x, n: x.cards.filter(c=>new Date(c.due).getTime()<=nowTs).length }))
        .sort((a,b)=>b.n-a.n)[0];
      if (dk && dk.n){ closeModal(); startStudy(dk.x.id, true); }
      else toast('No cards due for this subject');
      break; }
    case 'edit-subject': subjectModal(id); break;
    case 'save-subject': {
      const name = $('#m-name').value.trim(); if (!name){ toast('Name required'); return; }
      const topics = $('#m-topics').value.split('\n').map(x=>x.trim()).filter(Boolean)
        .map(n => ({ id:uid(), name:n, done:false, difficulty:2 }));
      const base = { name, examDate:$('#m-date').value||null, color:$('#m-color').value,
        weight:clamp(+$('#m-weight').value||2,1,3), confidence:clamp(+$('#m-conf').value||3,1,5) };
      if (el.dataset.id){
        const s = subjById(el.dataset.id);
        Object.assign(s, base);
        const existing = new Set(s.topics.map(t=>t.name));
        topics.forEach(t => { if (!existing.has(t.name)) s.topics.push(t); });
      } else {
        state.subjects.push({ id:uid(), topics, ...base });
      }
      save(); closeModal(); render(); toast('Subject saved ✓'); break; }
    case 'del-subject': {
      state.subjects = state.subjects.filter(s=>s.id!==id);
      state.tasks = state.tasks.filter(t=>t.subjectId!==id);
      state.decks = state.decks.filter(d=>d.subjectId!==id);
      state.doubts = (state.doubts||[]).filter(x=>x.subjectId!==id);
      save(); render(); break; }
    case 'add-topic': topicModal(id); break;
    case 'save-topic': {
      const s = subjById(el.dataset.sid); if (!s) break;
      const name = $('#m-tname')?.value.trim(); if (!name){ toast('Give the topic a name'); $('#m-tname')?.focus(); break; }
      s.topics.push({ id:uid(), name, done:false, difficulty:+$('#m-tdiff')?.value || 2 });
      save(); closeModal(); render(); toast('Topic added ✓'); break; }
    case 'toggle-topic': {
      const s = subjById(el.dataset.sid); const t = s?.topics.find(x=>x.id===el.dataset.id);
      if (t){ t.done = !t.done; save(); render(); } break; }
    case 'del-topic': {
      const s = subjById(el.dataset.sid); s.topics = s.topics.filter(x=>x.id!==el.dataset.id); save(); render(); break; }
    case 'load-demo': loadDemo(); render(); toast('Demo data loaded — explore, then clear and add your own'); break;
    // library
    case 'add-library': libraryModal(); break;
    case 'edit-library': libraryModal(id); break;
    case 'save-library': {
      const title = $('#m-ltitle').value.trim(); if (!title){ toast('Give it a title'); return; }
      const rec = { kind:$('#m-lkind').value, subjectId:$('#m-lsubject')?.value || null,
        title, meta:$('#m-lmeta').value.trim(), body:$('#m-lbody').value, updated:Date.now(),
        attachments: libAttDraft.slice() };
      if (el.dataset.id){ const it = (state.library||[]).find(x=>x.id===el.dataset.id); if (it) Object.assign(it, rec); }
      else { state.library = state.library || []; state.library.push({ id:uid(), ...rec }); }
      libAttDraft = [];
      save(); closeModal(); render(); toast('Saved to library ✓'); break; }
    case 'pwa-install': pwaInstall(); break;
    case 'notify-today': {
      if (window.Notification && Notification.permission === 'default') Notification.requestPermission().then(()=>notifyTasksToday());
      else notifyTasksToday();
      break; }
    case 'next-motiv': nextMotiv(); break;
    // backup & restore — keep a second copy of everything so data can never be lost
    case 'backup-download': {
      try {
        const blob = new Blob([JSON.stringify({ app:'studybuddy', user: user ? user.email : 'guest', at: Date.now(), data: state })], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `studybuddy-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
        toast('Backup downloaded ✓');
      } catch(err){ toast('Backup failed'); }
      break; }
    case 'backup-restore': {
      const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
      inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => { try {
          const j = JSON.parse(String(r.result)); const nd = j && j.data ? j.data : j;
          if (!nd || typeof nd !== 'object' || !('subjects' in nd)){ toast('That is not a ..STUDY BUDDYYY.. backup file'); return; }
          if (!confirm('Replace current data with this backup?')) return;
          state = Object.assign(defaultState(), nd); save(); render(); toast('Backup restored ✓');
        } catch(err){ toast('Could not read that backup'); } };
        r.readAsText(f); };
      inp.click(); break; }
    case 'pdf-library': libExportPdf(id); break;
    case 'share-library': libShare(id); break;
    case 'del-library': {
      if (!confirm('Delete this item from the library?')) break;
      state.library = (state.library||[]).filter(x=>x.id!==id); save(); render(); toast('Deleted'); break; }
    case 'copy-library': {
      const it = (state.library||[]).find(x=>x.id===id); if (!it) break;
      const txt = `${it.title}\n\n${it.body||''}`;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(()=>toast('Copied ✓'), ()=>toast('Copy failed'));
      else toast('Copy not supported here');
      break; }
    case 'lib-kind': libFilter.kind = el.dataset.kind; renderLibrary(); break;
    case 'lib-subject': libFilter.subject = el.dataset.sid; renderLibrary(); break;
    case 'lib-open': closeModal(); setView('library'); break;
    case 'lib-att-pick': {
      const inp = $('#m-lattfile'); if (!inp) break;
      inp.accept = el.dataset.kind === 'pdf' ? '.pdf,application/pdf' : 'image/*';
      inp.click(); break; }
    case 'lib-att-view': libViewAtt(id); break;
    case 'lib-att-del': {
      libAttDraft = libAttDraft.filter(a => a.id !== id);
      libRenderAtts(); break; }
    // auth
    case 'logout': doLogout(); break;
    case 'auth-submit': authSubmit(); break;
    case 'auth-guest': authGuest(); break;
    case 'auth-google-setup': { const p = $('#a-gsetup'); if (p) p.style.display = p.style.display==='none' ? 'block' : 'none'; break; }
    case 'auth-google-save': {
      const gid = ($('#a-gid')?.value||'').trim();
      if (!gid.includes('.apps.googleusercontent.com')){ authErr('That doesn\'t look like a Google Client ID (should end in apps.googleusercontent.com)'); break; }
      try { localStorage.setItem(GOOGLE_ID_KEY, gid); } catch(e){}
      toast('Client ID saved — activating Google sign-in');
      initGoogleAuth(); break; }
    case 'auth-google-remove': {
      try { localStorage.removeItem(GOOGLE_ID_KEY); } catch(e){}
      const box = $('#g-btn'); if (box) box.innerHTML = '';
      initGoogleAuth(); toast('Google sign-in ID removed'); break; }
    // pomodoro
    case 'pomo-start': pomoStart(); break;
    case 'pomo-pause': pomoPause(); break;
    case 'pomo-reset': pomoReset(); break;
    case 'pomo-skip': pomoSetMode(state.pomo.mode==='focus' ? 'break' : 'focus'); break;
    case 'pomo-mode': pomoSetMode(el.dataset.mode); break;
    // flashcards
    case 'add-deck-modal': deckModal(); break;

/* ============================================================
   AUTH — local email sign-in (offline; data stays on this device)
   ============================================================ */
function pwHash(pw){ let h = 5381; const s = 'studybuddy·' + pw;
  for (let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0; return 'h' + (h>>>0).toString(36); }
function getAccounts(){ try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}'); } catch(e){ return {}; } }
function setAccount(email, rec){ const a = getAccounts(); a[email] = rec;
  try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); } catch(e){} }
const sessionStore = {   // stay signed in across reloads; never let storage errors break login
  _m: null,
  get(){ try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ return this._m; } },
  set(v){ this._m = v; try { localStorage.setItem(SESSION_KEY, JSON.stringify(v)); } catch(e){} },
  clear(){ this._m = null; try { localStorage.removeItem(SESSION_KEY); } catch(e){} }
};

        <b>One-time setup (free):</b><br>

  };
  $('#a-email').addEventListener('input', upd); upd();
  ['#a-email','#a-pass','#a-name'].forEach(sel =>
    $(sel)?.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); authSubmit(); } }));

function authSubmit(){
  const email = ($('#a-email').value||'').trim().toLowerCase();
  const pass = $('#a-pass').value || '';
  const err = m => { $('#a-err').textContent = m; };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('Enter a valid email address');
  if (pass.length < 4) return err('Password needs at least 4 characters');
  const accounts = getAccounts(); const rec = accounts[email];
  let hash;
  if (rec){
    hash = rec.hash;
    if (rec.hash !== pwHash(pass)) return err('Wrong password for this email');
    user = { email, name: rec.name, since: rec.since };
  } else {
    hash = pwHash(pass);
    const name = ($('#a-name').value||'').trim() || email.split('@')[0].replace(/[._\-].*/, '');
    setAccount(email, { name, hash, since: Date.now() });
    user = { email, name, since: Date.now() };
  }
  sessionStore.set({ email, hash });
  $('#auth-screen').style.display = 'none'; $('#auth-screen').innerHTML = '';
  startApp();
}
function authGuest(){
  user = null;
  sessionStore.set({ guest:true });
  $('#auth-screen').style.display = 'none'; $('#auth-screen').innerHTML = '';
  startApp();
}
function doLogout(){
  if (state) save();
  sessionStore.clear();
  user = null; state = null;
  showAuth();
}

/* ---------- Google sign-in (needs a free OAuth Client ID) ---------- */
function authErr(m){ const el = $('#a-err'); if (el) el.textContent = m; }
function googleDecodeJwt(t){
  try {
    const b = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(b).split('').map(c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  } catch(e){ return null; }
}
let _gsiLoading = false;
function initGoogleAuth(){
  let cid = ''; try { cid = localStorage.getItem(GOOGLE_ID_KEY) || ''; } catch(e){}
  const box = $('#g-btn'); if (!box) return;
  if (!cid){ box.innerHTML = '<span class="sub" style="font-size:12px">Google button appears here once a Client ID is saved below.</span>'; return; }
  box.innerHTML = '<span class="sub" style="font-size:12px">Loading Google sign-in…</span>';
  const setup = () => {
    try {
      google.accounts.id.initialize({ client_id: cid, callback: handleGoogleCredential });
      box.innerHTML = '';
      google.accounts.id.renderButton(box, { theme:'filled_black', size:'large', width:320, text:'signin_with', shape:'pill' });
    } catch(e){ box.innerHTML = '<span class="sub" style="font-size:12px">Google sign-in failed to load — check the Client ID and registered origin.</span>'; }
  };
  if (window.google?.accounts?.id){ setup(); return; }
  if (_gsiLoading) return; _gsiLoading = true;
  const sc = document.createElement('script');
  sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.defer = true;
  sc.onload = () => { _gsiLoading = false; setup(); };
  sc.onerror = () => { _gsiLoading = false; box.innerHTML = '<span class="sub" style="font-size:12px">Couldn\'t reach Google right now — email sign-in still works.</span>'; };
  document.head.appendChild(sc);
}
function handleGoogleCredential(res){
  const p = googleDecodeJwt(res?.credential || '');
  if (!p || !p.email) return authErr('Google sign-in failed — no email in the response');
  const email = String(p.email).toLowerCase();
  const accounts = getAccounts(); let rec = accounts[email];
  if (!rec){
    rec = { name: p.name || email.split('@')[0], hash: 'google:' + p.sub, since: Date.now(), googleSub: p.sub };
    setAccount(email, rec);
  } else if (!rec.googleSub){
    rec.googleSub = p.sub; setAccount(email, rec);   // link Google to the existing local account
  }
  user = { email, name: rec.name, since: rec.since };
  sessionStore.set({ email, hash: rec.hash, google:true });
  $('#auth-screen').style.display = 'none'; $('#auth-screen').innerHTML = '';
  startApp();
}

/* ============================================================
   LIBRARY — important notes & previous papers (editable by you)
   ============================================================ */
let libFilter = { subject:'all', kind:'all' };
function renderLibrary(){
  const p = $('#panel-library');
  state.library = state.library || [];
  const items = state.library
    .filter(i => (libFilter.subject==='all' || i.subjectId===libFilter.subject)
              && (libFilter.kind==='all' || i.kind===libFilter.kind))
    .sort((a,b)=>(b.updated||0)-(a.updated||0));
  const kindBtn = (k, lbl) => `<button class="btn sm ${libFilter.kind===k?'':'ghost'}" data-act="lib-kind" data-kind="${k}">${lbl}</button>`;
  const subjBtn = (sid, lbl) => `<button class="btn sm ${libFilter.subject===sid?'':'ghost'}" data-act="lib-subject" data-sid="${sid}">${esc(lbl)}</button>`;
  p.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <div class="grow"><h2 style="margin:0;font-size:16px">Notes &amp; Previous Papers</h2>
        <p class="sub" style="margin:2px 0 0">Your exam bank — paste important notes, question papers and solutions. Update them anytime.</p></div>
      <button class="btn primary" data-act="add-library">＋ Add note / paper</button>
    </div>
    <div class="row wrap" style="gap:6px;margin-bottom:14px">
      ${kindBtn('all','All')}${kindBtn('note','📝 Notes')}${kindBtn('paper','📄 Papers')}
      <span style="width:10px"></span>
      ${subjBtn('all','All subjects')}
      ${state.subjects.map(s=>subjBtn(s.id, s.name)).join('')}
    </div>
    ${items.length ? items.map(libCard).join('') : `
      <div class="card"><div class="empty" style="margin-top:8px"><div class="big">🗂️</div>
        Nothing here yet — add important notes or previous papers.<br>They stay on this device and you can update them anytime.
        <br><br><button class="btn primary" data-act="add-library">＋ Add note / paper</button></div></div>`}`;
}
function libCard(i){
  const s = subjById(i.subjectId); const col = s ? s.color : '#6c8cff';
  const kindTag = i.kind==='paper' ? '<span class="tag">📄 paper</span>' : '<span class="tag">📝 note</span>';
  return `<div class="card">
    <div class="row wrap">
      <b style="font-size:14px">${esc(i.title)}</b>
      <span class="chip" style="background:${col}22;color:${col};padding:3px 10px;font-size:12px">${s?esc(s.name):'General'}</span>
      ${kindTag}
      ${i.meta ? `<span class="tag">${esc(i.meta)}</span>` : ''}
      <div style="flex:1"></div>
      <span class="tag">${timeAgo(i.updated||Date.now())}</span>
      <button class="btn sm ghost" data-act="copy-library" data-id="${i.id}">Copy</button>
      <button class="btn sm ghost" data-act="pdf-library" data-id="${i.id}" title="Export this note as a print-friendly PDF">⬇ PDF</button>
      <button class="btn sm ghost" data-act="share-library" data-id="${i.id}" title="Share via WhatsApp, email or your phone's share sheet">📤 Share</button>
      <button class="btn sm ghost" data-act="edit-library" data-id="${i.id}">✎ Edit</button>
      <button class="btn sm danger" data-act="del-library" data-id="${i.id}">Delete</button>
    </div>
    ${(i.attachments||[]).length ? `<div class="lib-atts">${(i.attachments||[]).map(a=>libAttRow(a,false)).join('')}</div>` : ''}
    <div class="sub" style="white-space:pre-wrap;margin-top:10px;max-height:280px;overflow:auto">${esc(i.body || '(empty)')}</div>
  </div>`;
}
function libraryModal(editId){
  const it = editId ? (state.library||[]).find(x=>x.id===editId) : null;
  if (!state.subjects.length && !it){ toast('Add a subject first'); return; }
  libAttDraft = it ? (it.attachments || []).slice() : [];
  openModal(`
    <h3>${it ? 'Edit' : 'New'} ${it && it.kind==='paper' ? 'previous paper' : 'note'}</h3>
    <div class="grid" style="gap:10px">
      <div class="grid g2">
        <label class="f">Type
          <select id="m-lkind">
            <option value="note" ${it&&it.kind==='note'?'selected':''}>📝 Important note</option>
            <option value="paper" ${it&&it.kind==='paper'?'selected':''}>📄 Previous paper</option>
          </select></label>
        <label class="f">Subject
          <select id="m-lsubject">${state.subjects.map(s=>`<option value="${s.id}" ${it&&it.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
      </div>
      <label class="f">Title<input id="m-ltitle" value="${it?esc(it.title):''}" placeholder="e.g. 2023 Final — Paper 2"></label>
      <label class="f">Label / year (optional)<input id="m-lmeta" value="${it?esc(it.meta||''):''}" placeholder="e.g. 2023 · Board · Set A"></label>
      <label class="f">Content
        <textarea id="m-lbody" style="min-height:150px" placeholder="Paste questions, solutions, key points…">${it?esc(it.body||''):''}</textarea></label>
      <div class="f">Attachments — photos &amp; PDFs <span style="color:var(--muted);font-weight:400;font-size:11.5px">(PDF up to 3 MB · photos shrink automatically)</span>
        <div id="m-latts" class="lib-atts"></div>
        <div class="row" style="gap:8px;margin-top:8px">
          <button class="btn sm ghost" data-act="lib-att-pick" data-kind="img">🖼️ Add photo</button>
          <button class="btn sm ghost" data-act="lib-att-pick" data-kind="pdf">📄 Add PDF</button>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn ghost" data-act="modal-close">Cancel</button>
      <button class="btn primary" data-act="save-library" data-id="${editId||''}">${it?'Save':'Add'}</button>
    </div>
    <input id="m-lattfile" type="file" accept="image/*,.pdf" multiple style="display:none">`);
  libRenderAtts();
  setTimeout(()=> $('#m-ltitle')?.focus(), 30);
}

/* ---------- render dispatcher & boot ---------- */
function currentView(){
  const active = $('.view-panel.active'); return active ? active.dataset.panel : 'dashboard';
}
function render(){
  renderPills();
  const v = currentView();
  if (v==='dashboard') renderDashboard();
  else if (v==='subjects') renderSubjects();
  else if (v==='plan') renderPlan();
  else if (v==='pomodoro') renderPomodoro();
  else if (v==='flashcards') renderFlashcards();
  else if (v==='doubts') renderDoubts();
  else if (v==='library') renderLibrary();
  else if (v==='coach') renderCoach();
}

function startApp(){
  state = load();
  if (!state){ loadDemo(); }
  // resume a running timer after reload
  if (state.pomo.running && state.pomo.endsAt && state.pomo.endsAt > Date.now()){
    pomoTick = setInterval(pomoTickFn, 250);
  } else if (state.pomo.running){
    state.pomo.running = false; state.pomo.endsAt = null;
    state.pomo.remainingMs = pomoDuration(state.pomo.mode); save();
  }
  render();
  // once-per-day notification about today's tasks
  if (state.settings.lastTaskNotify !== todayISO()){ state.settings.lastTaskNotify = todayISO(); save(); setTimeout(notifyTasksToday, 1200); }
}
/* ---------- PWA: installable app with its own icon on the home screen ---------- */
let pwaPromptEvt = null;
function pwaIcon(size){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#5b7cfa'); g.addColorStop(1, '#a75bfa');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '800 ' + Math.round(size*.42) + 'px Arial, sans-serif';
  x.fillText('Sβ', size/2, size*.52);
  return c.toDataURL('image/png');
}
function makePWA(){
  try {
    const m = {
      name: '..STUDY BUDDYYY..', short_name: 'StudyBuddy',
      description: 'Offline study planner, doubt solver, flashcards & focus timer — by Sbeta',
      start_url: location.href.split('#')[0],
      scope: new URL('./', location.href).href,
      display: 'standalone', display_override: ['standalone','fullscreen'],
      orientation: 'portrait',
      background_color: '#0b1020', theme_color: '#0b1020',
      icons: [192, 512].map(s => ({ src: pwaIcon(s), sizes: s+'x'+s, type: 'image/png', purpose: 'any maskable' }))
    };
    const link = document.getElementById('manifest-link') || document.head.appendChild(Object.assign(document.createElement('link'), { rel:'manifest', id:'manifest-link' }));
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(m));
    const ai = document.getElementById('apple-icon') || document.head.appendChild(Object.assign(document.createElement('link'), { rel:'apple-touch-icon', id:'apple-icon' }));
    ai.href = pwaIcon(180);
  } catch(e){}
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pwaPromptEvt = e; renderPills(); });
  window.addEventListener('appinstalled', () => { pwaPromptEvt = null; toast('📲 App installed — find it on your home screen'); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    // register only where sw.js is actually served (skips file:// and sandboxed previews)
    fetch('sw.js', { method:'HEAD' }).then(r => { if (r.ok) navigator.serviceWorker.register('sw.js').catch(()=>{}); }).catch(()=>{});
  }
}
async function pwaInstall(){
  if (pwaPromptEvt){ pwaPromptEvt.prompt(); const c = await pwaPromptEvt.userChoice;
    if (c && c.outcome === 'accepted'){ pwaPromptEvt = null; toast('Installing…'); }
    return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  toast(ios ? 'In Safari: tap Share ▲ → "Add to Home Screen"' : 'In the browser menu choose "Install app" / "Add to Home screen"');
}

(function boot(){
  makePWA();
  const sess = sessionStore.get();
  if (sess && sess.guest){ user = null; startApp(); return; }
  if (sess && sess.email){
    const rec = getAccounts()[sess.email];
    if (rec && rec.hash === sess.hash){ user = { email: sess.email, name: rec.name, since: rec.since }; startApp(); return; }
  }
  showAuth();
})();

</script>
