<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">  <title>Sbeta · ..STUDY BUDDYYY.. — Study Planner & Doubt Solver</title>
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyBuddy">
<link id="manifest-link" rel="manifest">
<link id="apple-icon" rel="apple-touch-icon">
<style>
:root{
  --bg:#0b0e15; --panel:#131a29; --panel2:#0e1420; --border:#232c42; --border2:#2d3854;
  --text:#e8edf7; --muted:#8b94ab; --accent:#6c8cff; --accent2:#8b6cff;
  --green:#2dd4a0; --amber:#f5b04c; --red:#f26d6d; --cyan:#4cc9f0;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(108,140,255,.14), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(139,108,255,.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#273049;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
  padding:18px 12px;border-right:1px solid var(--border);background:rgba(14,19,32,.6);backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5b7cfa,#a75bfa);
  display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 18px rgba(108,140,255,.35)}
.brand b{font-size:14px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;
  background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font:inherit;font-weight:600;
}
.nav-btn:hover{color:var(--text);background:#161e30}
.nav-btn.active{color:var(--text);background:#1a2338;border-color:var(--border2);box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn .ico{width:20px;text-align:center}
.side-foot{margin-top:auto;padding:10px 8px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--border)}
.side-foot .row{display:flex;justify-content:space-between;margin:3px 0}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:14px 26px;border-bottom:1px solid var(--border);background:rgba(11,14,21,.82);backdrop-filter:blur(8px);
}
.topbar h1{margin:0;font-size:17px}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:#161e30;
  border:1px solid var(--border2);font-weight:600;font-size:12.5px;white-space:nowrap}
.pill.warn{color:var(--amber);border-color:rgba(245,176,76,.35)}
.pill.good{color:var(--green);border-color:rgba(45,212,160,.35)}
.pill.acc{color:#aebfff;border-color:rgba(108,140,255,.4)}
.content{padding:22px 26px 60px;max-width:1180px;width:100%}
.view-panel{display:none}
.view-panel.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:linear-gradient(180deg,#141b2c,#111726);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card + .card{margin-top:16px}
.card h2{margin:0 0 4px;font-size:15px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;align-items:center;gap:10px}
@media(max-width:480px){ .row{flex-wrap:wrap} .row .grow{min-width:200px} }
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;cursor:pointer;
  background:#1c2438;border:1px solid var(--border2);color:var(--text);font:inherit;font-weight:600;white-space:nowrap;
  transition:background .12s,transform .06s;
}
.btn:hover{background:#232d47}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#5b7cfa,#7c5bfa);border-color:transparent;box-shadow:0 4px 16px rgba(108,140,255,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:linear-gradient(135deg,#1fae82,#17a06f);border-color:transparent}
.btn.danger{background:transparent;border-color:rgba(242,109,109,.4);color:var(--red)}
.btn.danger:hover{background:rgba(242,109,109,.12)}
.btn.ghost{background:transparent;border-color:var(--border2);color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

input,select,textarea{
  background:#0d1424;border:1px solid #26304c;border-radius:10px;color:var(--text);
  padding:8px 11px;font:inherit;outline:none;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,140,255,.15)}
textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=date]{color-scheme:dark}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}

.bar{height:8px;background:#1b2438;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:#1b2438;border:1px solid var(--border2);color:var(--muted);font-size:11px;font-weight:600}

.stat{padding:14px 16px;border-radius:12px;background:#131a2b;border:1px solid var(--border)}
.stat .k{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:24px;font-weight:800;margin-top:2px}
.stat .s{color:var(--muted);font-size:11.5px}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:#121a2b;border:1px solid var(--border)}
.item:hover{border-color:var(--border2)}
.item.done{opacity:.5}
.item.done .title{text-decoration:line-through}
.item .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--muted);font-size:11.5px;white-space:nowrap}

.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--border2);border-radius:12px}
.empty .big{font-size:30px;margin-bottom:6px}

.hero{background:linear-gradient(135deg,rgba(108,140,255,.16),rgba(139,108,255,.08));border-color:rgba(108,140,255,.35)}

/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:420px}
.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 4px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#4d6ef0,#6c4df0);border-bottom-right-radius:4px}
.msg.coach{align-self:flex-start;background:#161e30;border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .t{font-size:10.5px;color:var(--muted);margin-top:6px}
.msg b{color:#fff}
.msg .msg-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.goal-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:#101828;border:1px solid var(--border);margin-top:6px;cursor:pointer}
.chat-input{display:flex;gap:10px;padding-top:12px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}
.chipbtn{padding:6px 12px;border-radius:99px;background:#161e30;border:1px solid var(--border2);color:var(--muted);cursor:pointer;font-size:12px;font-weight:600}
.chipbtn:hover{color:var(--text);border-color:var(--accent)}

/* pomodoro */
.pomo-grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:900px){.pomo-grid{grid-template-columns:1fr}}
.pomo-face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 18px}
.ring-wrap{position:relative;width:250px;height:250px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#1c2438;stroke-width:13}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-center .time{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.ring-center .mode{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:1.5px}
.dotrow{display:flex;gap:7px;margin-top:8px}
.dot{width:10px;height:10px;border-radius:99px;background:#232c44}
.dot.on{background:var(--green)}

/* flashcards */
.study-card{position:relative;perspective:1200px;height:300px;cursor:pointer;margin-bottom:14px}
.study-card .face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border2);
  background:linear-gradient(160deg,#182136,#121a2c);display:flex;align-items:center;justify-content:center;
  padding:28px;text-align:center;font-size:18px;font-weight:600;white-space:pre-wrap;overflow:auto;transition:transform .35s;
}
.study-card .back{transform:rotateY(180deg);background:linear-gradient(160deg,#152a24,#12231e);border-color:rgba(45,212,160,.35)}
.study-card.flipped .front{transform:rotateY(180deg)}
.study-card.flipped .back{transform:rotateY(360deg)}

/* decks */
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.deckcard{padding:14px;border-radius:12px;background:#131a2b;border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.deckcard:hover{border-color:var(--border2)}

/* doubts */
.db-ans{border-left:3px solid var(--accent);background:#101a2e;border-radius:0 10px 10px 0;margin-top:10px}
.db-q{font-weight:700;font-size:14px}
.db-thumb{width:86px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--border2);cursor:zoom-in;background:#0d1322}
/* chat thread (WhatsApp-style) */
.db-card{position:relative}
.db-thread{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.db-msg{display:flex;flex-direction:column;max-width:88%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.db-msg.left{align-self:flex-start;align-items:flex-start}
.db-msg.me{align-self:flex-end;align-items:flex-end}
.db-bubble{padding:9px 12px;border-radius:14px;background:#161e30;border:1px solid var(--border2);font-size:13px;line-height:1.5;color:#c8d2e8;word-break:break-word}
.db-msg.q .db-bubble{background:#181f33;border-bottom-left-radius:4px}
.db-msg.coach .db-bubble{background:#101a2e;border-color:rgba(108,140,255,.4);border-bottom-left-radius:4px}
.db-msg.me .db-bubble{background:#0f241d;border-color:rgba(45,212,160,.4);border-bottom-right-radius:4px}
.db-msg.me.teach .db-bubble{background:#241d0f;border-color:rgba(245,185,66,.45)}
.db-bmeta{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--muted);margin-bottom:3px}
.db-msg.me .db-bmeta{flex-direction:row-reverse}
.db-bmeta .who{font-weight:700;font-size:11.5px;color:var(--text)}
.db-msg.coach .db-bmeta .who{color:var(--accent)}
.db-msg.me .db-bmeta .who{color:var(--green)}
.db-msg.me.teach .db-bmeta .who{color:var(--amber)}
.db-ava{width:22px;height:22px;border-radius:99px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:800;color:#0b1020;flex:none}
.db-bimg{max-width:240px;max-height:210px;width:auto;border-radius:10px;display:block;margin-top:6px;cursor:zoom-in;border:1px solid var(--border2);background:#0d1322}
.db-reactrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center}
.db-rchip{border:1px solid var(--border2);background:#161e30;border-radius:99px;padding:1px 8px;font-size:11.5px;cursor:pointer;color:var(--text);line-height:1.7}
.db-rchip:hover{border-color:var(--accent)}
.db-rchip.on{background:rgba(108,140,255,.25);border-color:var(--accent)}
.db-rbar{display:inline-flex;gap:3px;background:#131a2b;border:1px solid var(--border2);border-radius:99px;padding:2px 6px}
.db-poll{min-width:230px}
.db-poll .pq{font-weight:700;color:var(--text);margin-bottom:6px}
.db-poll .pv{font-size:10.5px;color:var(--muted);margin-top:5px}
.db-popt{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--border2);background:#131a2b;border-radius:9px;padding:7px 10px;margin-top:5px;cursor:pointer;color:#c8d2e8;font-size:12.5px;overflow:hidden}
.db-popt:hover{border-color:var(--accent)}
.db-popt .bar{position:absolute;top:0;left:0;bottom:0;background:rgba(108,140,255,.16)}
.db-popt.mine .bar{background:rgba(45,212,160,.22)}
.db-popt .lbl{position:relative;display:flex;justify-content:space-between;gap:10px}
.db-popt .pct{color:var(--muted);font-weight:700;white-space:nowrap}
.db-popt .tick{color:var(--green);font-weight:800}
.db-inrow{display:flex;gap:6px;align-items:center;margin-top:12px}
.db-ebtn{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;background:#1a2338;border:1px solid var(--border2);cursor:pointer;font-size:15px}
.db-ebtn:hover{border-color:var(--accent)}
.db-ebtn.act{border-color:var(--accent)}
.db-emoji-pop{position:absolute;bottom:48px;right:8px;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:#131a2b;border:1px solid var(--border2);border-radius:12px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.db-eb{background:none;border:none;font-size:17px;cursor:pointer;padding:3px 5px;border-radius:7px;line-height:1.3}
.db-eb:hover{background:#1e2740}
.db-pend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.db-pend img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--border2)}
/* library attachments (photos & PDFs) */
.lib-atts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lib-att{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#101a2e;border:1px solid var(--border2);border-radius:10px;font-size:12.5px;color:#c8d2e8}
.lib-att .ic{font-size:18px}
.lib-att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-att .sz{color:var(--muted);font-size:11px;flex-shrink:0}
.lib-att button{flex-shrink:0}
.lib-afile{width:34px;height:34px;object-fit:cover;border-radius:8px;border:1px solid var(--border2);cursor:zoom-in;background:#0d1322;flex-shrink:0}
#m-latts .lib-att{background:#161e30}
.block-tools{display:flex;gap:4px}
.iconbtn{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#1a2338;border:1px solid var(--border2);color:var(--muted);cursor:pointer;font-size:12px}
.iconbtn:hover{color:var(--text)}
.rev-card{padding:14px 16px;border-radius:12px;background:#131a2b;border:1px solid var(--border);margin-bottom:10px;cursor:pointer}
.rev-card .lbl{font-weight:700;margin-bottom:4px}
.rev-card .body{filter:blur(6px);user-select:none;transition:filter .2s;color:#c8d2e8;white-space:pre-wrap}
.rev-card.revealed .body{filter:none;user-select:auto}

/* modal & toast */
#modal-backdrop{position:fixed;inset:0;background:rgba(5,8,14,.66);backdrop-filter:blur(3px);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:7vh 16px}
#modal-backdrop.open{display:flex}
.modal{background:#131a2b;border:1px solid var(--border2);border-radius:16px;padding:20px;width:100%;max-width:520px;max-height:82vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:fade .15s ease}
.modal.wide{max-width:720px}
.modal h3{margin:0 0 12px;font-size:16px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c2438;border:1px solid var(--border2);
  color:var(--text);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.chart .stick{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--accent),#3b55c9);min-height:2px}
.chart .col.today .stick{background:linear-gradient(180deg,var(--green),#149469)}
.chart .lbl{font-size:10px;color:var(--muted);font-weight:700}

#print-area{display:none}
@media print{
  body{background:#fff;color:#000}
  .app,#modal-backdrop,#toast{display:none !important}
  #print-area{display:block;padding:24px}
  #print-area h1{font-size:22px;margin:0 0 2px}
  #print-area .cols{columns:2;column-gap:18px;margin-top:14px}
  #print-area .pb{break-inside:avoid;border:1px solid #bbb;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  #print-area .pb b{display:block;border-bottom:1px solid #ddd;padding-bottom:3px;margin-bottom:4px}
}

@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;top:0;height:auto;z-index:30;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--border);background:rgba(11,14,21,.9)}
  .brand{padding:0 8px 0 0}.brand small{display:none}
  .nav-btn{width:auto;white-space:nowrap;padding:7px 11px}
  .nav-btn.active{box-shadow:none}
  .side-foot{display:none}
  .topbar{padding:12px 14px;flex-wrap:wrap}
  .content{padding:16px 14px 60px}
}
  /* auth screen + user chip */
  #auth-screen{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:radial-gradient(900px 600px at 15% 0%,#16203a,#0b0f1a 70%)}
  .auth-card{width:min(420px,92vw);background:#131a2b;border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
  .auth-err{color:var(--red);font-size:12.5px;min-height:18px;margin:6px 0 2px}
  .user-chip{display:flex;align-items:center;gap:9px;padding:8px 9px;margin-bottom:8px;border:1px solid var(--border);border-radius:10px;background:#131a2b}
  .avatar{width:30px;height:30px;flex:none;border-radius:50%;background:var(--accent);color:#0b0f1a;display:grid;place-items:center;font-weight:800;font-size:13px}
  .uc-n{font-weight:700;font-size:12.5px;line-height:1.2}
  .uc-e{color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">Sβ</div><div><b>..STUDY BUDDYYY..</b><small>by Sbeta</small></div></div>
    <button class="nav-btn active" data-act="nav" data-view="dashboard"><span class="ico">📊</span>Dashboard</button>

<script>
/* ============================================================
   ..STUDY BUDDYYY.. (Sbeta) — offline study planner
   Data lives in localStorage. Local email sign-in; nothing leaves the device.
   ============================================================ */
'use strict';

const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS_KEY = 'studybuddy.v1';
const SESSION_KEY = 'studybuddy.session';
const ACCOUNTS_KEY = 'studybuddy.accounts';
const GOOGLE_ID_KEY = 'studybuddy.googleClientId';
const DAY = 86400000;
let user = null;               // signed-in profile {email, name, since} — null = guest

function todayISO(d = new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function addDaysISO(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return todayISO(d); }
function daysUntil(iso){ if(!iso) return null; return Math.round((parseISO(iso) - parseISO(todayISO())) / DAY); }
function fmtDay(iso){ return parseISO(iso).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}); }
function fmtDayShort(iso){ return parseISO(iso).toLocaleDateString(undefined, {month:'short', day:'numeric'}); }
function fmtMin(m){ return m >= 60 ? `${Math.floor(m/60)}h ${m%60 ? m%60+'m' : ''}`.trim() : `${m}m`; }
function timeAgo(ms){ const s = Math.floor((Date.now()-ms)/1000);
  if (s<60) return 'just now'; if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<DAY) return Math.floor(s/3600)+'h ago'; return Math.floor(s/DAY)+'d ago'; }

const SUBJECT_COLORS = ['#6c8cff','#2dd4a0','#f5b04c','#f26d6d','#a78bfa','#4cc9f0','#ec6aa8','#a3c94c'];
const CARD_INTERVALS = [0, 1, 3, 7, 16, 35]; // Leitner boxes 1..5 → days
const DIFF_LABEL = {1:'Easy', 2:'Medium', 3:'Hard'};

/* ---------- state ---------- */
let state = null;
function defaultState(){
  return {
    settings: { focusMin:25, breakMin:5, longBreakMin:15, cyclesBeforeLong:4, dailyTargetMin:120, soundOn:true },
    subjects: [],   // {id,name,color,examDate,confidence(1-5),weight(1-3),topics:[{id,name,done,difficulty}]}
    tasks:    [],   // {id,subjectId,title,date,minutes,done,source:'plan'|'manual',topicId}
    sessions: [],   // {id,subjectId,minutes,at}
    decks:    [],   // {id,subjectId,name,cards:[{id,front,back,box,due}]}
    sheets:   [],   // (kept for old saved data) — replaced by doubts
    doubts:   [],   // {q, a, subjectId, tags, solved, created}
    goals:    [],   // {id,text,done}
    library:  [],   // {id,kind:'note'|'paper',subjectId,title,meta,body,updated}
    chat:     [],
    pomo:     { mode:'focus', endsAt:null, remainingMs:25*60000, cycle:0, subjectId:null, taskId:null, running:false },
  };
}
const dataKey = () => user ? `studybuddy.v1:u:${user.email}` : LS_KEY;
function save(){ try { const s = JSON.stringify(state); localStorage.setItem(dataKey(), s); localStorage.setItem(dataKey()+':bak', s); } catch(e){ console.warn('save failed', e); } }
function load(){
  try {
    const key = dataKey();
    let raw = localStorage.getItem(key);
    if ((!raw || raw === 'undefined' || raw === 'null')){   // primary copy lost/corrupt → rescue from backup
      const bak = localStorage.getItem(key + ':bak');
      if (bak && bak !== 'undefined'){ try { JSON.parse(bak); localStorage.setItem(key, bak); raw = bak; console.warn('primary data missing — restored from backup copy'); } catch(e){} }
    }
    if (!raw && user){
      // first sign-in on this device → adopt the pre-login data so nothing is lost
      const legacy = localStorage.getItem(LS_KEY);
      if (legacy && !localStorage.getItem('studybuddy.migrated')){
        localStorage.setItem(key, legacy); localStorage.setItem('studybuddy.migrated', '1'); raw = legacy;
      }
      if (!raw){ // one-time migration from the old app name
        const old = localStorage.getItem('focuspilot.v1');
        if (old){ localStorage.setItem(key, old); localStorage.removeItem('focuspilot.v1'); raw = old; }
      }
    }
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s.doubts) s.doubts = s.doubts.map(d => d.id ? d : Object.assign(d, { id: uid() })); // repair pre-fix doubts
    return Object.assign(defaultState(), s);
  } catch(e){ return null; }
}
const subjById = id => state.subjects.find(s => s.id === id);
const subjColor = s => s ? s.color : '#6c8cff';
const topicProgress = s => { const n = s.topics.length; const d = s.topics.filter(t=>t.done).length; return {n, d, pct: n ? Math.round(d/n*100) : 0}; };

function minutesOn(iso){ return state.tasks.filter(t=>t.date===iso && t.done).reduce((a,t)=>a+t.minutes,0); }
function plannedOn(iso){ return state.tasks.filter(t=>t.date===iso).reduce((a,t)=>a+t.minutes,0); }
function studiedOn(iso){
  return state.sessions.filter(s => todayISO(new Date(s.at)) === iso).reduce((a,s)=>a+s.minutes,0);
}
function streakDays(){
  let n = 0; let iso = todayISO();
  if (studiedOn(iso) < 20) iso = addDaysISO(iso, -1); // today not started yet doesn't break streak
  while (studiedOn(iso) >= 20) { n++; iso = addDaysISO(iso, -1); }
  return n;
}
function cardsDueCount(){
  const now = Date.now();
  return state.decks.reduce((a,d)=> a + d.cards.filter(c => new Date(c.due).getTime() <= now).length, 0);
}
function nextExam(){
  const upcoming = state.subjects.filter(s => s.examDate && daysUntil(s.examDate) >= 0)
    .sort((a,b)=> daysUntil(a.examDate) - daysUntil(b.examDate));
  return upcoming[0] || null;
}

/* ---------- demo data ---------- */
function loadDemo(){
  const t = todayISO();
  const tk = (name, difficulty, done=false) => ({ id:uid(), name, done, difficulty });
  const math = { id:uid(), name:'Mathematics', color:'#6c8cff', examDate:addDaysISO(t,18), confidence:3, weight:3, topics:[
    tk('Quadratic equations',1,true), tk('Trigonometric identities',2), tk('Calculus: derivatives',3),
    tk('Calculus: integration',3), tk('Probability',2), tk('Statistics basics',1,true),
    tk('Vectors',2), tk('Sequences & series',2) ]};
  const phys = { id:uid(), name:'Physics', color:'#2dd4a0', examDate:addDaysISO(t,9), confidence:2, weight:3, topics:[
    tk('Kinematics',1,true), tk("Newton's laws",2), tk('Work, energy & power',2), tk('Momentum',2),
    tk('Circular motion',3), tk('Waves & sound',2), tk('Optics basics',1) ]};

  const now = Date.now();
  const card = (front, back, box=1, dueOffsetMin=0) => ({ id:uid(), front, back, box, due:new Date(now - 60000 + dueOffsetMin*60000).toISOString() });
  const decks = [
    { id:uid(), subjectId:phys.id, name:'Physics — core recall', cards:[
      card("State Newton's second law", 'F = ma — net force equals mass × acceleration. Give a worked example with units.'),
      card('Define momentum & its unit', 'p = mv, measured in kg·m/s. In a closed system momentum is conserved.'),

      card('When is work done zero?', 'When force is perpendicular to displacement, e.g. circular motion — W = Fd cosθ, cos90° = 0.', 2, 60000)]},
    { id:uid(), subjectId:math.id, name:'Maths — formulas', cards:[
      card('Quadratic formula', 'x = (−b ± √(b² − 4ac)) / 2a. Discriminant > 0 → two roots, = 0 → one, < 0 → none (real).'),
      card('sin²θ + cos²θ = ?', '1. Divide by cos²θ to get 1 + tan²θ = sec²θ.')]},
  ];
  const doubts = [
    { id:uid(), subjectId:phys.id, q:'A car brakes from 20 m/s and stops in 50 m. What was its deceleration?',
      a:'**1.** List what you know: u = 20 m/s, v = 0, s = 50 m, a = ?\n\n**2.** Pick a SUVAT equation without time: v² = u² + 2as.\n\n**3.** Solve: 0 = 400 + 2a·50 → 100a = −400 → **a = −4 m/s²**.\n\n**Why:** the negative sign just means the car slows down. Write it as 4 m/s² deceleration in the answer.', tags:['Kinematics','SUVAT'], solved:true },
    { id:uid(), subjectId:math.id, q:'When do I use integration vs differentiation?',
      a:'**Rule of thumb:**\n• Differentiation → rates of change, gradients, velocity from displacement.\n• Integration → accumulation, areas, displacement from velocity.\n\n**Check:** does the question ask *how fast something changes* → differentiate. Does it ask *total of something built up over time* → integrate.', tags:['Calculus'], solved:true }
  ];
  const tasks = [
    { id:uid(), subjectId:phys.id, title:"Study: Newton's laws", date:t, minutes:50, done:false, source:'plan' },
    { id:uid(), subjectId:phys.id, title:'Active recall — flashcards (Physics)', date:t, minutes:25, done:true, source:'plan' },
    { id:uid(), subjectId:phys.id, title:'Revise solved doubts (Physics)', date:t, minutes:15, done:false, source:'plan' },
    { id:uid(), subjectId:math.id, title:'Study: Calculus — derivatives', date:addDaysISO(t,1), minutes:75, done:false, source:'plan' },
  ];
  const sessions = [
    { id:uid(), subjectId:phys.id, minutes:25, at: now - 3*3600000 },
    { id:uid(), subjectId:math.id, minutes:25, at: now - 1*DAY - 3600000 },
    { id:uid(), subjectId:phys.id, minutes:50, at: now - 1*DAY - 2*3600000 },
    { id:uid(), subjectId:math.id, minutes:25, at: now - 2*DAY - 3600000 },
    { id:uid(), subjectId:phys.id, minutes:50, at: now - 3*DAY - 3600000 },
  ];
  state = Object.assign(defaultState(), { subjects:[math,phys,hist], decks, doubts, tasks, sessions,
    goals: [ { id:uid(), text:'Clear all due flashcards today', done:false },
             { id:uid(), text:'Revise the solved doubts before each exam', done:false } ],
    chat: [] });
  save();
}

/* ---------- tiny UI kit ---------- */
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=> el.classList.remove('show'), 2400); }
function openModal(html, {wide=false}={}){
  const back = $('#modal-backdrop');
  back.innerHTML = `<div class="modal${wide?' wide':''}">${html}</div>`;
  back.classList.add('open');
  back.onclick = e => { if (e.target === back) closeModal(); };
  $$('[data-act=modal-close]', back).forEach(b => b.onclick = closeModal);
}
function closeModal(){ if (typeof libBlobUrl === 'string' && libBlobUrl){ try { URL.revokeObjectURL(libBlobUrl); } catch(e){} libBlobUrl = null; }
  $('#modal-backdrop').classList.remove('open'); $('#modal-backdrop').innerHTML=''; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  // shortcut: E opens the exam-dates editor (unless typing or a modal is open)
  if ((e.key === 'e' || e.key === 'E') && !e.ctrlKey && !e.metaKey && !e.altKey){
    const t = e.target;
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if (!typing && !$('#modal-backdrop').classList.contains('open')){ e.preventDefault(); openExamDatesModal(); }
  }
});

const VIEW_TITLES = { dashboard:'Dashboard', subjects:'Subjects & Syllabus', plan:'Study Plan',
  pomodoro:'Focus Timer', flashcards:'Flashcards — Active Recall',  doubts:'Doubt Solver',
  library:'Notes & Previous Papers', coach:'AI Study Coach' };

/* ---------- navigation ---------- */
function setView(v){
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $$('.view-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === v));
  $('#topbar-title').textContent = VIEW_TITLES[v] || v;
  render();
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'nav') setView(btn.dataset.view);
});

/* ---------- topbar pills + sidebar footer ---------- */
function renderPills(){
  const exam = nextExam();
  const d = exam ? daysUntil(exam.examDate) : null;
  $('#pill-exam').innerHTML = exam
    ? `<span class="pill acc">🎓 ${esc(exam.name)} · ${d===0?'today': d===1?'tomorrow':'in '+d+' days'}</span>`
    : `<span class="pill warn">No exam date set</span>`;
  $('#pill-today').innerHTML = `<span class="pill">📅 ${fmtDay(todayISO())}</span>`;
  const due = cardsDueCount();
  $('#pill-streak').innerHTML = `<span class="pill ${due?'warn':'good'}">🔥 ${streakDays()}d streak${due?` · ${due} cards due`:''}</span>`;

  const mins = studiedOn(todayISO());
  const target = state.settings.dailyTargetMin;
  const uname = user ? user.name : 'Guest';
  const uemail = user ? user.email : 'no account';
  $('#side-foot').innerHTML = `
    <div class="user-chip">
      <span class="avatar">${esc((uname[0]||'G').toUpperCase())}</span>
      <div style="min-width:0;flex:1"><div class="uc-n">${esc(uname)}</div><div class="uc-e">${esc(uemail)}</div></div>
      <button class="iconbtn" data-act="pwa-install" title="Install as an app on this phone (home-screen icon)">📲</button>
      <button class="iconbtn" data-act="backup-download" title="Download a backup of all your data">⬇</button>
      <button class="iconbtn" data-act="backup-restore" title="Restore data from a backup file">⬆</button>
      <button class="iconbtn" data-act="logout" title="Log out">⏻</button>
    </div>
    <div class="row"><span>Today</span><b>${fmtMin(mins)} / ${fmtMin(target)}</b></div>
    <div class="bar"><i style="width:${clamp(mins/target*100,0,100)}%"></i></div>
    <div style="margin-top:8px;display:flex;justify-content:space-between"><span>Subjects</span><b>${state.subjects.length}</b></div>
    <div class="row"><span>Tasks done</span><b>${state.tasks.filter(t=>t.done).length}/${state.tasks.length}</b></div>`;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const t = todayISO();
  const todays = state.tasks.filter(x => x.date === t).sort((a,b)=> a.done - b.done);
  const studied = studiedOn(t);
  const planned = plannedOn(t);
  const due = cardsDueCount();
  const ex = nextExam();
  const upcoming = state.subjects.filter(s=>s.examDate && daysUntil(s.examDate)>=0)
    .sort((a,b)=>daysUntil(a.examDate)-daysUntil(b.examDate));
  const dueCards = due ? dueCountBySubject() : [];
  const chart = weekChart();

  $('#panel-dashboard').innerHTML = `
    <div class="card hero">
      <div class="row wrap">
        <div class="grow">
          <h2 style="font-size:18px">${greeting()}${ex ? ` — ${esc(ex.name)} in <span style="color:var(--accent)">${Math.max(daysUntil(ex.examDate),0)} days</span>` : ''}</h2>
          <p class="sub" style="margin:6px 0 0">${dashboardHint(due, planned, studied)}${ex ? examMotiv(ex) : ''}</p>
        </div>
        <button class="btn primary" data-act="start-recommended">▶ Start recommended session</button>
      </div>
    </div>

    <div class="grid g4" style="margin-top:16px">
      <div class="stat"><div class="k">Studied today</div><div class="v">${fmtMin(studied)}</div><div class="s">target ${fmtMin(state.settings.dailyTargetMin)}</div></div>
      <div class="stat"><div class="k">Planned today</div><div class="v">${planned ? fmtMin(planned) : '—'}</div><div class="s">${todays.length} task${todays.length===1?'':'s'} · ${todays.filter(x=>x.done).length} done</div></div>
      <div class="stat"><div class="k">Cards due</div><div class="v">${due}</div><div class="s">active recall</div></div>
      <div class="stat"><div class="k">Streak</div><div class="v">${streakDays()}d</div><div class="s">keep it alive 🔥</div></div>
    </div>

    <div style="margin-top:16px">
      <div>
        <div class="card">
          <h2>This week's study time</h2>
          <div class="chart">${chart}</div>
        </div>
        <div class="card">
          <div class="row wrap">
            <h2 style="margin:0">Exam countdowns</h2>
            <div style="flex:1"></div>
            <button class="btn sm ghost" data-act="edit-exams" title="Shortcut: E">✎ Dates</button>
          </div>
          ${upcoming.length ? `<div class="list" style="margin-top:10px">${upcoming.map(s => {
            const d = daysUntil(s.examDate); const p = topicProgress(s);
            const urgency = d<=3 ? 'var(--red)' : d<=7 ? 'var(--amber)' : 'var(--green)';
            return `<div class="item">
              <span class="chip" style="background:${s.color}22;color:${s.color}">${esc(s.name)}</span>
              <div class="grow">
                <div class="bar"><i style="width:${p.pct}%;background:${s.color}"></i></div>
                <div class="meta">syllabus ${p.pct}% · ${p.d}/${p.n} topics</div>
              </div>
              <b style="color:${urgency}">${d===0?'TODAY':d+'d'}</b>
            </div>`;}).join('')}</div>`
          : `<p class="sub">No upcoming exams. Set dates in <b>Subjects</b> — the planner and coach use them.</p>`}
        </div>
        ${dueCards.length ? `<div class="card">
          <h2>Recall backlog</h2>
          <div class="list" style="margin-top:10px">${dueCards.map(({deck,n,color,name})=>`
            <div class="item"><span class="chip" style="background:${color}22;color:${color}">${esc(name)}</span>
              <div class="grow">${esc(deck.name)}</div><b style="color:var(--amber)">${n} due</b>
              <button class="btn sm primary" data-act="study-deck" data-id="${deck.id}">Study</button></div>`).join('')}</div>
        </div>` : ''}
        ${state.goals.length ? `<div class="card">
          <h2>Goals</h2>
          <div class="list" style="margin-top:10px">${state.goals.map(g=>`
            <div class="item ${g.done?'done':''}">
              <input type="checkbox" ${g.done?'checked':''} data-act="toggle-goal" data-id="${g.id}">
              <div class="grow"><div class="title">${esc(g.text)}</div></div>
              <button class="iconbtn" data-act="del-goal" data-id="${g.id}">✕</button>
            </div>`).join('')}</div>
        </div>` : ''}
      </div>
    </div>`;
}

function greeting(){ const h = new Date().getHours();
  const base = h<12?'Good morning ☀️':h<18?'Good afternoon 👋':'Good evening 🌙';
  return base + (user ? `, ${esc(user.name.split(/[ ._-]/)[0])}` : ''); }
function dashboardHint(due, planned, studied){
  if (!state.subjects.length) return 'Add your subjects and exam dates first — everything else builds on them.';
  if (due) return `You have <b>${due}</b> flashcards due — clear them first, recall beats re-reading.`;
  if (!planned) return 'No tasks planned for today. Ask the coach, or generate a full plan from the Study Plan tab.';
  if (studied >= state.settings.dailyTargetMin) return `Daily target hit (${fmtMin(studied)}) — anything more is a bonus. Consider light review only.`;
  return `Stay on plan: <b>${fmtMin(Math.max(planned-studied,0))}</b> left to reach today's schedule.`;
}

/* motivational boost tied to the exam countdown (tap to shuffle) */
const EXAM_MOTIV = [
  'Consistency beats intensity — every focused session compounds.',
  'Small steps every day turn exam stress into exam readiness.',
  'One more revision now means one less panic later. You have got this.',
  'Progress, not perfection — every finished topic makes you stronger.',
  'The exam rewards the calm, prepared mind you are building right now.',
  'Believe in the work you already put in — it is carrying you forward.',
  'Tough chapters make strong students. You are doing the hard part.',
  'Your future self is cheering for the effort you make today.',
  'Focus is a muscle — every minute you study, it grows.',
  'Trust the plan, trust the process, trust yourself.',
];
let motivIdx = new Date().getDate() % EXAM_MOTIV.length;
function nextMotiv(){ motivIdx = (motivIdx+1) % EXAM_MOTIV.length; renderDashboard(); }
function examMotiv(ex){
  const days = Math.max(daysUntil(ex.examDate), 0);
  const lead = days===0 ? 'Exam day — trust your preparation and give it your best! 🍀'
    : days===1 ? `One day to ${esc(ex.name)} — revise light, rest well. You are ready! 💪`

/* ============================================================
   AI PLANNER ENGINE
   Priority model:
   urgency  = how close the exam is
   weakness = low confidence, high difficulty topics remaining
   value    = subject weight
   Each day gets a capacity (daily target) filled with study /
   recall / review blocks until full.
   ============================================================ */
function subjectPriority(s, days){
  const pr = topicProgress(s);
  const remaining = pr.n - pr.d;
  const conf = 6 - s.confidence;               // low confidence → high priority
  const urgency = s.examDate && days >= 0 ? clamp(30 - Math.min(days,30), 2, 30) : 6;
  const overload = (s.examDate && days >= 0 && days < 14 && remaining > 0)
    ? clamp((remaining * s.weight) / Math.max(days,1) / 2, 0, 6) : 0;
  return urgency + conf * 1.6 + s.weight * 2 + overload;
}

function nextTopic(s){
  const open = s.topics.filter(t=>!t.done);
  if (!open.length) return null;
  open.sort((a,b)=> b.difficulty - a.difficulty);
  return open[0];
}

function buildPlan(){
  const t = todayISO();
  const subs = state.subjects.filter(s => s.topics.length);
  if (!subs.length) return { tasks:[], days:0, note:'Add subjects and syllabus topics first.' };

  const capacity = state.settings.dailyTargetMin;
  const horizon = 14;
  // keep completed tasks, user-created manual tasks & far-future items; replace the rest of the horizon
  const keepIds = new Set(state.tasks.filter(x => x.done || x.source==='manual' || x.date > addDaysISO(t, horizon)).map(x=>x.id));
  const tasks = state.tasks.filter(x => keepIds.has(x.id));

  const schedule = {}; // iso -> minutes used
  for (let i=0;i<horizon;i++) schedule[addDaysISO(t,i)] = 0;
  schedule[t] = tasks.filter(x=>x.date===t && x.done).reduce((a,x)=>a+x.minutes,0);

  const focusMin = state.settings.focusMin;
  const entries = [];

  // Pass 1 — spaced recall blocks (25m) for subjects with decks, every ~3 days
  subs.forEach(s => {
    if (!state.decks.some(d=>d.subjectId===s.id)) return;
    for (let i=1;i<horizon;i+=3){
      const iso = addDaysISO(t, i);
      if (schedule[iso] + 25 <= capacity + 30){
        schedule[iso] += 25;
        entries.push({ subjectId:s.id, title:`Active recall — flashcards (${s.name})`, date:iso, minutes:25, source:'plan' });
      }
    }
  });

  // Pass 2 — topic study blocks by priority
  const queue = [...subs].sort((a,b)=> subjectPriority(b, daysUntil(b.examDate)) - subjectPriority(a, daysUntil(a.examDate)))
    .map(s => ({ s, remaining: s.topics.filter(x=>!x.done).length }));
  let guard = 0;
  while (queue.some(q=>q.remaining>0) && guard++ < 500){
    let placed = false;
    for (let i=0;i<horizon;i++){
      const iso = addDaysISO(t, i);
      const free = capacity - schedule[iso];
      if (free < focusMin) continue;
      queue.sort((a,b)=> subjectPriority(b.s, daysUntil(b.s.examDate) - i) - subjectPriority(a.s, daysUntil(a.s.examDate) - i));
      const q = queue.find(x=>x.remaining>0);
      if (!q) break;
      const topic = nextTopic(q.s);
      if (!topic){ q.remaining = 0; continue; }
      const mins = topic.difficulty === 3 ? focusMin*2 : focusMin; // hard topics get a double block
      const use = Math.min(mins, Math.floor(free/focusMin)*focusMin || focusMin);
      if (use > free) continue;
      schedule[iso] += use;
      entries.push({ subjectId:q.s.id, title:`Study: ${topic.name}`, date:iso, minutes:use, source:'plan', topicId:topic.id });
      q.remaining--;
      placed = true;
      break;
    }
    if (!placed) break;
  }

  // Pass 3 — pre-exam doubt revision the evening before each exam
  for (const s of subs){
    if (!s.examDate) continue;
    const d = daysUntil(s.examDate);
    if (d >= 1 && d <= horizon && (state.doubts||[]).some(x=>x.subjectId===s.id)){
      const iso = addDaysISO(s.examDate, -1);
      if (schedule[iso] !== undefined){
        schedule[iso] += 15;
        entries.push({ subjectId:s.id, title:`Revise doubts (${s.name})`, date:iso, minutes:15, source:'plan' });
      }
    }
  }

  entries.forEach(e => tasks.push({ id:uid(), done:false, ...e }));
  tasks.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : a.done - b.done);
  state.tasks = tasks; save();

  const forToday = entries.filter(e=>e.date===t).length;
  return { tasks:entries, days:horizon,
    note:`Scheduled ${entries.length} blocks across ${horizon} days (${forToday} today) — weighted by exam urgency, difficulty, confidence and subject weight.` };
}

/* ============================================================
   POMODORO
   ============================================================ */
let pomoTick = null;
function pomoDuration(mode){
  const st = state.settings;
  return (mode==='focus' ? st.focusMin : mode==='break' ? st.breakMin : st.longBreakMin) * 60000;
}
function pomoStart(){
  const p = state.pomo;
  if (!p.endsAt) p.endsAt = Date.now() + p.remainingMs;
  p.running = true; save();
  clearInterval(pomoTick);
  pomoTick = setInterval(pomoTickFn, 250);
  pomoTickFn();
}
function pomoPause(){
  const p = state.pomo;
  if (p.endsAt) p.remainingMs = Math.max(0, p.endsAt - Date.now());
  p.endsAt = null; p.running = false; save();
  clearInterval(pomoTick);
  renderPomodoro();
}
function pomoReset(){
  const p = state.pomo;
  clearInterval(pomoTick);
  p.running=false; p.endsAt=null; p.remainingMs=pomoDuration(p.mode); save();
  renderPomodoro();
}
function pomoSetMode(mode, auto=false){
  const p = state.pomo;
  clearInterval(pomoTick);
  p.mode = mode; p.running=false; p.endsAt=null; p.remainingMs=pomoDuration(mode); save();
  renderPomodoro();
  if (auto) pomoStart();
}
function pomoTickFn(){
  const p = state.pomo;
  if (!p.running) return;
  const left = p.endsAt ? p.endsAt - Date.now() : p.remainingMs;
  if (left <= 0){ pomoComplete(); return; }
  const el = $('#pomo-time');
  if (el){
    el.textContent = fmtClock(left);
    const total = pomoDuration(p.mode);
    const R = 112, C = 2*Math.PI*R;
    const fg = $('#pomo-ring-fg');
    if (fg) fg.style.strokeDashoffset = String(C * (1 - left/total));
    const pct = Math.round((1 - left/total)*100);
    document.title = `${fmtClock(left)} · ${p.mode==='focus'?'Focus':'Break'} — ..STUDY BUDDYYY..`;
    const ppe = $('#pomo-pct'); if (ppe) ppe.textContent = pct + '%';
  }
}
function fmtClock(ms){ const s = Math.max(0, Math.ceil(ms/1000)); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function pomoComplete(){
  const p = state.pomo;
  clearInterval(pomoTick);
  ping();
  if (p.mode === 'focus'){
    const mins = state.settings.focusMin;
    state.sessions.push({ id:uid(), subjectId:p.subjectId, minutes:mins, at:Date.now() });
    if (p.taskId){ const task = state.tasks.find(x=>x.id===p.taskId); if (task) task.done = true; }
    p.cycle = (p.cycle||0) + 1;
    save();
    toast(`🍅 Pomodoro done — ${mins}m logged${p.subjectId ? ' to ' + ((subjById(p.subjectId)||{}).name||'') : ''}`);
    const long = p.cycle % state.settings.cyclesBeforeLong === 0;
    pomoSetMode(long ? 'longbreak' : 'break', false);
    if (window.Notification && Notification.permission === 'granted')
      new Notification('🍅 Focus session complete', { body:`${mins} minutes logged. Time for a ${long?'long ':''}break!` });
  } else {
    toast('☕ Break over — ready for the next block?');
    pomoSetMode('focus', false);
    if (window.Notification && Notification.permission === 'granted')
      new Notification('☕ Break finished', { body:'Back to focus when you are ready.' });
  }
  render();
}
function ping(){ if (!state.settings.soundOn) return;
  try { const ac = new (window.AudioContext||window.webkitAudioContext)();
    [880, 1174].forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination); o.frequency.value=f; o.type='sine';
      const t0 = ac.currentTime + i*0.18; g.gain.setValueAtTime(0.001,t0);
      g.gain.exponentialRampToValueAtTime(0.2,t0+0.02); g.gain.exponentialRampToValueAtTime(0.001,t0+0.5);
      o.start(t0); o.stop(t0+0.55); }); } catch(e){} }

function renderStudySession(p, deck){
  const card = deck.cards.find(c=>c.id===study.queue[study.idx]);

  $('#topbar-title').textContent = `Studying — ${deck.name}`;
  p.innerHTML = `

}

function startStudy(deckId, dueOnly){
  const deck = state.decks.find(d=>d.id===deckId); if (!deck || !deck.cards.length) return;
  const now = Date.now();
  let cards = dueOnly ? deck.cards.filter(c=>new Date(c.due).getTime()<=now) : deck.cards.slice();
  if (!cards.length) cards = deck.cards.slice();
  cards.sort((a,b)=> new Date(a.due)-new Date(b.due));
  study = { deckId, queue: cards.map(c=>c.id), idx:0, seen:0, right:0, flipped:false };
  setView('flashcards');
}
function flipCard(){ if (!study) return; study.flipped = true; const deck = state.decks.find(d=>d.id===study.deckId); renderStudySession($('#panel-flashcards'), deck); }
function rateCard(r){
  if (!study) return;
  const deck = state.decks.find(d=>d.id===study.deckId);
  const card = deck.cards.find(c=>c.id===study.queue[study.idx]);
  const oldBox = card.box;
  card.box = r===1 ? 1 : clamp(card.box + (r===3?2:1), 1, 5);
  if (card.box > oldBox) study.right++;
  card.due = new Date(Date.now() + CARD_INTERVALS[card.box]*DAY).toISOString();
  study.seen++; study.idx++; study.flipped=false; save();
  if (study.idx >= study.queue.length){
    toast(`🎉 Session done — ${study.seen} cards, ${study.right} recalled strong`);
    study = null;
  }
  render();
}

/* ---------- library attachments (photos & PDFs) ---------- */
const LIB_PDF_MAX = 3 * 1024 * 1024;   // localStorage is ~5MB total — cap PDFs at 3MB
let libAttDraft = [];                  // pending attachments inside the library modal
function libFmtSize(n){ return n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }
function libAddAtts(files){
  if (!files || !files.length) return;
  let pending = files.length;
  const done = () => { if (--pending === 0) libRenderAtts(); };
  for (const f of files){
    if (f.size > LIB_PDF_MAX){ toast(`"${f.name}" is too big — max 3 MB per file`); done(); continue; }
    const r = new FileReader();
    r.onload = async () => {
      try {
        const att = { id:uid(), name:f.name, size:f.size, at:Date.now() };
        if (/^image\//.test(f.type)){ att.kind = 'img'; att.data = await dbShrinkImg(String(r.result), 1024); att.size = Math.round(att.data.length * .75); }
        else { att.kind = 'pdf'; att.data = String(r.result); }
        libAttDraft.push(att);
      } catch(err){ console.warn('attachment failed', err); }
      done();
    };
    r.onerror = done;
    r.readAsDataURL(f);
  }
}

/* ---------- print-friendly PDF export of one note (offline, real PDF) ---------- */
function pdfAscii(s){ const m = {'—':'-','–':'-','·':'*','→':'->','✓':'v','✕':'x','•':'*','…':'...','β':'B','‘':"'",'’':"'",'“':'"','”':'"','−':'-'};
  s = String(s||'').replace(/[—–·→✓✕•…β‘’“”−]/g, c=>m[c]); let out='';
  for (const ch of s){ const c = ch.codePointAt(0); if (c >= 32 && c <= 255) out += ch; } return out; }
function pdfEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function pdfWrap(s, n){ const out = [];
  String(s||'').split('\n').forEach(par => { let cur = '';
    par.split(' ').forEach(w => { const t = cur ? cur+' '+w : w;
      if (t.length <= n) cur = t;
      else { if (cur) out.push(cur); if (w.length > n){ let r = w; while (r.length > n){ out.push(r.slice(0,n)); r = r.slice(n); } cur = r; } else cur = w; } });
    out.push(cur); }); return out; }
async function libExportPdf(id){
  const it = (state.library||[]).find(x=>x.id===id); if (!it) return;
  toast('Building PDF…');
  const s = subjById(it.subjectId);
  const imgs = [];
  for (const a of (it.attachments||[])){
    if (a.kind !== 'img') continue;
    try {
      const im = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = a.data; });
      if (!im) continue;
      const sc = Math.min(1, 1200 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width*sc)); c.height = Math.max(1, Math.round(im.height*sc));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const durl = c.toDataURL('image/jpeg', .85);
      imgs.push({ name: a.name, bin: atob(durl.split(',')[1]), w: c.width, h: c.height });
    } catch(e){ console.warn('img embed failed', e); }
  }
  const PW = 612, PH = 792, MX = 48, CW = PW - 2*MX;
  const items = [
    ...pdfWrap(pdfAscii(it.title), 46).map(l => ({ k:'t', l })),
    { k:'m', l: pdfAscii(`${s ? s.name : 'General'} · ${it.kind==='paper' ? 'Previous paper' : 'Important note'}${it.meta ? ' · '+it.meta : ''} · ${new Date(it.updated||Date.now()).toLocaleDateString()}`) },
    { k:'rule' },
    ...pdfWrap(pdfAscii(it.body || '(no content)'), 88).map(l => ({ k:'b', l })),
  ];
  const pdfs = (it.attachments||[]).filter(a=>a.kind==='pdf');
  if (imgs.length || pdfs.length){
    items.push({ k:'h2', l:'Attachments' });
    imgs.forEach(im => items.push({ k:'img', im }));
    pdfs.forEach(a => items.push({ k:'att', l: `PDF  ${a.name}  (${libFmtSize(a.size)}) - open it in ..STUDY BUDDYYY.. to view or download` }));
  }
  const pages = []; let ops = '', y = PH - 56;
  const txt = (x,yy,size,font,gray,str) => { ops += `BT /${font} ${size} Tf ${gray} g ${x} ${yy} Td (${pdfEsc(str)}) Tj ET\n`; };
  const newPage = () => { pages.push(ops); ops = ''; y = PH - 56; };
  let imgNo = 0;
  for (const it2 of items){
    let h = 0;
    if (it2.k==='t') h = 24; else if (it2.k==='m') h = 16; else if (it2.k==='rule') h = 12;
    else if (it2.k==='b') h = 15; else if (it2.k==='h2') h = 24; else if (it2.k==='att') h = 14;
    else if (it2.k==='img'){ const r = it2.im.h / it2.im.w; let dw = CW, dh = CW*r; if (dh > 330){ dh = 330; dw = 330/r; } it2.dw = dw; it2.dh = dh; h = dh + 16; }
    if (y - h < 52) newPage();
    if (it2.k==='t'){ y -= 20; txt(MX, y, 15, 'F2', '0 0 0', it2.l); y -= 4; }
    else if (it2.k==='m'){ y -= 12; txt(MX, y, 9, 'F1', '0.45 0.45 0.55', it2.l); }
    else if (it2.k==='rule'){ y -= 6; ops += `0.8 G 0.7 w ${MX} ${y} m ${PW-MX} ${y} l S\n`; y -= 6; }
    else if (it2.k==='b'){ y -= 15; txt(MX, y, 10.5, 'F1', '0 0 0', it2.l); }
    else if (it2.k==='h2'){ y -= 20; txt(MX, y, 11.5, 'F2', '0 0 0', it2.l); }
    else if (it2.k==='att'){ y -= 14; txt(MX, y, 9.5, 'F1', '0.3 0.3 0.4', pdfAscii(it2.l)); }
    else if (it2.k==='img'){ imgNo++; y -= it2.dh;
      ops += `q ${it2.dw.toFixed(1)} 0 0 ${it2.dh.toFixed(1)} ${MX} ${y.toFixed(1)} cm /Im${imgNo} Do Q\n`;
      ops += `0.85 G 0.6 w ${MX} ${y.toFixed(1)} m ${MX+it2.dw} ${y.toFixed(1)} l ${MX+it2.dw} ${(y+it2.dh).toFixed(1)} l ${MX} ${(y+it2.dh).toFixed(1)} l h S\n`;
      y -= 16; txt(MX, y, 8, 'F1', '0.45 0.45 0.55', pdfAscii(it2.im.name)); }
  }
  newPage();
  pages.forEach((o, i) => { const d = pages.length; ops = o;
    txt(MX, 32, 7.5, 'F1', '0.55 0.55 0.65', `..STUDY BUDDYYY.. (Sbeta) · ${d>1 ? 'page '+(i+1)+' of '+d : new Date().toLocaleDateString()}`); pages[i] = ops; ops = ''; });
  const objs = []; const addO = (dict, stream) => { objs.push({ dict, stream }); return objs.length; };
  imgs.forEach(im => { addO(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bin.length} >>`, im.bin); });
  const F1 = addO('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const F2 = addO('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const xo = imgs.length ? ` /XObject << ${imgs.map((_,i)=>`/Im${i+1} ${i+1} 0 R`).join(' ')} >>` : '';
  const pageObjs = pages.map(st => {
    const cNum = addO(`<< /Length ${st.length} >>`, st);
    return addO(`<< /Type /Page /Parent PAGES 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 ${F1} 0 R /F2 ${F2} 0 R >>${xo} >> /Contents ${cNum} 0 R >>`);
  });
  const pagesNum = addO(`<< /Type /Pages /Kids [${pageObjs.map(n=>n+' 0 R').join(' ')}] /Count ${pageObjs.length} >>`);
  objs.forEach(o => { if (o.dict.includes('/Parent PAGES 0 R')) o.dict = o.dict.replace('/Parent PAGES 0 R', '/Parent '+pagesNum+' 0 R'); });
  const root = addO(`<< /Type /Catalog /Pages ${pagesNum} 0 R >>`);
  let pdf = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(pdf.length);
    pdf += (i+1)+' 0 obj\n'+o.dict+'\n'+(o.stream != null ? 'stream\n'+o.stream+'\nendstream\n' : '')+'endobj\n'; });
  const xref = pdf.length;
  pdf += 'xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n' + offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  pdf += 'trailer\n<< /Size '+(objs.length+1)+' /Root '+root+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  const bytes = new Uint8Array(pdf.length); for (let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  const url = URL.createObjectURL(new Blob([bytes], { type:'application/pdf' }));

function solveDoubt(text, subjectId){
  const q = text.replace(/\s+/g,' ').trim();

  const t = q.replace(/^(what|why|how|when|where|which|who|explain|define|solve|derive|prove|tell me about|can you explain)[\s:]+/i,'').replace(/\?+$/,'').trim();
  const s = subjById(doubtSubject(q, subjectId));
  const subject = s ? s.name.toLowerCase() : '';
  const looksNum = /\d/.test(q) && /(find|solve|calculate|how (much|far|fast|long|many)|what is the (value|speed|distance|area|force|velocity|acceleration)|evaluate)/.test(lower);
  let steps;
  if (looksNum){
    steps = [
      '**Understand** — list what is given and what is asked. Write every value with its unit (e.g. u = 20 m/s, find a).',
      '**Choose the tool** — pick the formula/rule that connects the given quantities to the asked one. Mentions time? Use the time-based form; avoids time? Use the form without it.',
      '**Substitute & solve** — insert values step by step, keep units in every line, and watch the sign (+/−).',
      '**Check** — is the magnitude sensible? Does the unit match what was asked? One line on why the answer makes sense earns method marks.' ];
  } else if (/(why|reason)/.test(lower)){
    steps = [
      '**Claim** — state the direct answer in one line first.',
      '**Because** — give the rule, law or definition behind it in your own words.',
      '**Link** — connect that rule to this exact question: what changes, what stays fixed.',
      '**Example** — one quick example; showing the opposite case failing proves the rule.' ];
  } else if (/(difference|compare|vs\b|versus|distinguish)/.test(lower)){
    steps = [
      '**Define both** — one line each, in your own words.',
      '**Compare in rows** — basis (definition / formula / example / where used) against the two items.',
      '**Takeaway** — the single most exam-asked contrast, in one line.' ];
  } else if (/(derive|prove|show that)/.test(lower)){
    steps = [
      '**Start from** — write the accepted law/definition you may assume, by name.',
      '**Each step = one idea** — justify every line with the rule used; this is where the marks live.',
      '**Arrive** — box the final expression exactly in the form asked ("show that …").',
      '**Assumptions** — state the conditions (constant acceleration, ideal gas, frictionless…).' ];
  } else if (/(define|what is|what are|meaning)/.test(lower)){
    steps = [
      '**One-line definition** — exact and dense; this is what the mark scheme scans for.',
      '**Key terms** — define each keyword inside the definition in 3–5 words.',
      '**Formula or diagram** — attach the standard formula or a labelled sketch.',
      '**Example** — one concrete instance; definition + example is the full-mark pattern.' ];
  } else {
    steps = [
      `**Break it down** — split “${t || q}” into 2–3 smaller sub-questions and answer them in order.`,
      '**Core idea** — name the chapter/topic this belongs to and state its main rule.',
      '**Work an example** — apply the rule to a simple case to see the pattern clearly.',
      '**Exam angle** — prepare it both ways: a 2-mark direct question and a 5-mark application.' ];
  }
  const tips = { math:'Write every step — method marks beat the final answer.', mathematics:'Write every step — method marks beat the final answer.',
    physics:'Units and signs carry marks — carry them through every line.',
    chemistry:'Balance equations first; state conditions (temperature, catalyst) wherever relevant.',
    biology:'Use the exact textbook terms — loose synonyms often lose the mark.',
    history:'Answer = point + evidence + why it mattered. Dates are your evidence.',
    geography:'Quote a fact, a figure and a place name in every answer.' };
  const tipKey = Object.keys(tips).find(k => subject.includes(k));
  let a = `**Quick answer:** ${t || q} — work the steps below and say them aloud as you go.\n\n` + steps.join('\n\n') + `\n\n**Golden rule:** re-attempt this same question tomorrow from memory — that is what converts a doubt into marks.`;
  if (tipKey) a += `\n\n**${s ? s.name : 'Subject'} tip:** ${tips[tipKey]}`;
  return { subjectId: s ? s.id : null, q, a, tags: extractTags(q), solved:true };
}

/* ============================================================
   AI STUDY COACH — offline rules-based advisor
   Reads live state (exams, syllabus, sessions, cards) and answers
   with concrete plans, goals and coaching. Can apply actions.
   ============================================================ */
function coachContext(){
  const t = todayISO();
  return {
    t,
    subjects: state.subjects.map(s => ({ ...s, days: daysUntil(s.examDate), pr: topicProgress(s) }))
      .sort((a,b)=> (a.days ?? 999) - (b.days ?? 999)),
    studied: studiedOn(t), planned: plannedOn(t), dueCards: cardsDueCount(), streak: streakDays(),
  };
}

function coachReply(q){
  const ctx = coachContext();
  const lower = q.toLowerCase();
  const nameList = ctx.subjects.map(s=>s.name);
  const mentioned = ctx.subjects.find(s => lower.includes(s.name.toLowerCase()));

  // --- intents ---
  if (ctx.subjects.length === 0)
    return "Let's start from scratch: head to **Subjects**, add each course with its exam date, and list the syllabus as topics. Then come back and ask me to *plan my week* — I'll do the scheduling.";

  if (/\b(hi|hello|hey|help|what can you)\b/.test(lower))
    return `I'm your study coach. Here's what I can do right now:\n• **Plan my day / week** — I'll schedule blocks around your exams\n• **What should I study?** — I'll pick the highest-priority topic\n• **Am I on track?** — honest readiness check per exam\n• **Set goals** — I'll propose today's goals\nYour nearest exam: **${ctx.subjects[0].name}** (${ctx.subjects[0].days}d).`;

  if (/(plan|schedule|timetable|what.*today|my day|my week)/.test(lower)){
    if (!ctx.planned){ const r = buildPlan(); return `Done — I've generated a full plan. ${r.note}\nCheck the **Study Plan** tab. Today's blocks are waiting on the dashboard. 🎯`; }
    const left = ctx.subjects[0];
    return `Today you have **${fmtMin(ctx.planned)}** planned (${state.tasks.filter(x=>x.date===ctx.t && !x.done).length} blocks left) and you've logged **${fmtMin(ctx.studied)}**.\nStart with the first uncompleted block on the dashboard. ${left.days<7 ? `${left.name} is in ${left.days} days — protect that time.` : 'Stay consistent and the plan does the work.'}\nWant a fresh schedule? Say **rebuild my plan**.`; }

  if (/(rebuild|regenerate|new plan)/.test(lower)){
    const r = buildPlan(); return `Rebuilt ✨ ${r.note}`; }

  if (/(what should i study|what next|priority|first|focus on)/.test(lower)){
    const s = mentioned || ctx.subjects[0];
    const topic = nextTopic(s);
    if (!topic) return `${s.name} is fully done 🎉 — everything is ticked off. Try mixed recall or past papers next.`;
    return `Highest priority right now: **${s.name} → ${topic.name}** (difficulty ${DIFF_LABEL[topic.difficulty]}, ${s.days ?? '?'} days to exam).\nReasoning: exam is close, confidence is ${s.confidence}/5, and this is one of the hardest topics left.\nHit **▶ Start recommended session** on the dashboard and I'll pair the timer with it.`; }

  if (/(on track|ready|how am i|progress|readiness)/.test(lower)){
    const lines = ctx.subjects.map(s => {
      const pace = s.days > 0 && s.pr.n > s.pr.d ? Math.ceil((s.pr.n - s.pr.d) / s.days) : 0;
      const verdict = s.pr.pct >= 80 ? 'on track ✅' : s.pr.pct >= 50 ? 'close, but push ⚠️' : s.days <= 7 ? 'at risk 🔴' : 'needs momentum 🟡';
      return `• **${s.name}** — ${s.pr.pct}% done, exam in ${s.days ?? '—'}d, confidence ${s.confidence}/5 → ${verdict}${pace ? ` (tick ~${pace} topic(s)/day)` : ''}`;
    });
    return `Readiness check:\n${lines.join('\n')}\n${ctx.dueCards ? `Also: **${ctx.dueCards} flashcards due** — recall first, always.` : 'Recall deck is clear — nice.'}`; }

  if (/(goal|goals)/.test(lower)){
    const gs = suggestGoals();
    return `Here are today's goals — tap to add any of them:\n` + gs.map(g=>`▸ ${g}`).join('\n'); }

  if (/(flashcard|recall|memoriz|memoris|revise|review)/.test(lower)){
    const deckCount = state.decks.reduce((a,d)=>a+d.cards.length,0);
    return ctx.dueCards
      ? `You have **${ctx.dueCards} cards due** across your decks (${deckCount} total). Active recall is the highest-value 25 minutes you can spend — open **Flashcards** and clear them before new material.`
      : deckCount ? `Recall deck is clear ✅. Next cards return over the coming days (spaced repetition). Meanwhile: teach a topic aloud from your notes, or re-attempt a solved doubt.`
      : `No decks yet. Create a deck per subject in **Flashcards** and add 5–10 question cards per topic. Writing the question is itself revision.`; }

  if (/(doubt|stuck|don.t understand|do not understand|confus|not getting|clarif)/.test(lower)){
    return `Tell me the doubt as a question — open **Doubt Solver**, type it, and I'll break it into steps and save it for revision.`; }

  if (/(pomodoro|timer|25|break)/.test(lower))
    return `Pomodoro recipe: ${state.settings.focusMin}m focus / ${state.settings.breakMin}m break, long break after ${state.settings.cyclesBeforeLong} cycles. Pair each timer with a subject so your stats stay honest. Open **Focus Timer** and press ▶.`;

  if (/(procrastin|lazy|motivat|tired|overwhelm|stress|anxious)/.test(lower)){
    const s = ctx.subjects[0];
    return `Overwhelm is usually an unbounded to-do list. Fix:\n1. Commit to **one ${state.settings.focusMin}m block** on **${s.name} → ${nextTopic(s)?.name || 'review'}** — nothing else.\n2. Phone in another room.\n3. After the block, take the ${state.settings.breakMin}m break guilt-free.\nMomentum beats motivation. Start the timer and I'll log it.`; }

  if (/(exam|test) .*(tomorrow|today|next week)/.test(lower) || (mentioned && mentioned.days <= 2)){
    const s = mentioned || ctx.subjects[0];
    return `**${s.name}** is ${s.days===0?'TODAY':`tomorrow`} — switch modes:\n• No new topics. Review solved doubts + flashcards only.\n• Do one past paper section under time.\n• Sleep is a study technique: stop by ${state.settings.dailyTargetMin>240?'22:30':'23:00'}.\nYou've got ${s.pr.pct}% of the syllabus banked — trust it.`; }

  // default: situational summary
  const s = ctx.subjects[0];
  return `Here's where you stand:\n• Nearest exam: **${s.name}** in ${s.days}d (${s.pr.pct}% syllabus done)\n• Today: ${fmtMin(ctx.studied)} studied / ${fmtMin(ctx.planned)} planned\n• ${ctx.dueCards} cards due · streak ${ctx.streak}d\n\nSay **plan my day**, **what should I study**, **am I on track**, or **set goals** — or mention a subject by name.`;
}

function suggestGoals(){
  const ctx = coachContext(); const out = [];
  if (ctx.dueCards) out.push(`Clear ${ctx.dueCards} due flashcards`);
  const s = ctx.subjects[0];
  if (s){ const topic = nextTopic(s); if (topic) out.push(`Study ${s.name}: ${topic.name}`); }
  if (ctx.studied < state.settings.dailyTargetMin)
    out.push(`Reach ${fmtMin(state.settings.dailyTargetMin)} total study time today`);
  if (!state.decks.length) out.push('Create a flashcard deck for one subject');
  if (out.length < 3) out.push('One 25m solved-doubt revision sprint');
  return out.slice(0,4);
}

function introMessage(){
  const ctx = coachContext();
  if (!ctx.subjects.length) return "Hi! I'm your study coach 🤖\nStart by adding **subjects with exam dates** in the Subjects tab. Then ask me to *plan your day*, pick priorities, check if you're on track, or clear doubts.";
  return `Hi! I'm your study coach 🤖\nI can see ${ctx.subjects.length} subject(s) — nearest exam: **${ctx.subjects[0].name}** in ${ctx.subjects[0].days}d.\nAsk me to plan your day, pick what to study, check your readiness, or set goals.`;
}
function mdLite(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');
}
function sendChat(preset){
  const inp = $('#chat-input');
  const text = (preset || (inp && inp.value) || '').trim();
  if (!text) return;
  state.chat.push({ role:'user', text, t:Date.now() });
  const reply = coachReply(text);
  const actions = [];
  if (/rebuild|generate/i.test(reply)) actions.push({ label:'✨ Open Study Plan', view:'plan' });
  if (/doubt/i.test(text)){ actions.push({ label:'🙋 Solve it', view:'doubts' }); }
  const goals = suggestGoals();
  if (text.toLowerCase().includes('goal')){
    goals.forEach(g => actions.push({ label:`＋ ${g}`, run:'add-goal', arg:g }));
  }
  state.chat.push({ role:'coach', text:reply, t:Date.now(), actions });
  save();
  renderCoach();
}

function subjectDetailModal(id){
  const s = subjById(id); if (!s) return;
  const pr = topicProgress(s);
  const d = daysUntil(s.examDate);
  const urg = !s.examDate ? 'var(--muted)' : d<=3 ? 'var(--red)' : d<=7 ? 'var(--amber)' : 'var(--green)';
  const examTxt = !s.examDate ? 'no exam date' : d<0 ? `past · ${fmtDayShort(s.examDate)}` : d===0 ? 'TODAY' : `in ${d}d · ${fmtDayShort(s.examDate)}`;
  const pace = (s.examDate && d>=0 && pr.n>pr.d) ? `⚡ ~${Math.max(1, Math.ceil((pr.n-pr.d) * Math.max(s.weight,1) * 0.75 / Math.max(d,1)))} topic(s)/day needed` : '';
  const tasks = state.tasks.filter(t=>t.subjectId===id);
  const openTasks = tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  const sessions = state.sessions.filter(x=>x.subjectId===id);
  const totalMin = sessions.reduce((a,x)=>a+x.minutes,0);
  const weekMin = sessions.filter(x=>new Date(x.at).getTime() >= Date.now()-7*864e5).reduce((a,x)=>a+x.minutes,0);
  const decks = state.decks.filter(dk=>dk.subjectId===id);
  const cards = decks.reduce((a,dk)=>a+dk.cards.length,0);
  const now = Date.now();
  const due = decks.reduce((a,dk)=>a+dk.cards.filter(c=>new Date(c.due).getTime()<=now).length,0);
  const boxes = [1,2,3,4,5].map(b => decks.reduce((a,dk)=>a+dk.cards.filter(c=>c.box===b).length,0));
  const doubts = (state.doubts||[]).filter(x=>x.subjectId===id);
  const dbSolved = doubts.filter(x=>x.solved).length;
  openModal(`
    <h3 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="chip" style="background:${s.color}22;color:${s.color};font-size:15px;padding:6px 14px">${esc(s.name)}</span>
      <span class="pill" style="border-color:${urg}55;color:${urg}">🎓 ${examTxt}</span>
    </h3>
    <div class="row wrap" style="margin-top:10px;gap:6px">
      <span class="tag">weight ${s.weight}/3</span>
      <span class="tag">confidence ${'●'.repeat(s.confidence)}${'○'.repeat(5-s.confidence)}</span>
      ${(() => { const libN = (state.library||[]).filter(x=>x.subjectId===id).length;
        return libN ? `<button class="btn sm ghost" data-act="lib-open" style="padding:2px 10px">🗂️ ${libN} in library</button>` : ''; })()}
      ${pace ? `<span class="tag" style="color:var(--amber)">${pace}</span>` : ''}
    </div>
    <div class="grid g4" style="margin-top:14px">
      <div class="stat"><div class="k">Syllabus</div><div class="v">${pr.pct}%</div><div class="s">${pr.d} of ${pr.n} topics done</div></div>
      <div class="stat"><div class="k">Study time</div><div class="v">${totalMin ? fmtMin(totalMin) : '—'}</div><div class="s">${fmtMin(weekMin)} in last 7 days</div></div>
      <div class="stat"><div class="k">Flashcards</div><div class="v">${cards||'—'}</div><div class="s">${due} due now · ${decks.length} deck${decks.length===1?'':'s'}</div></div>
      <div class="stat"><div class="k">Doubts</div><div class="v">${doubts.length||'—'}</div><div class="s">${dbSolved} solved</div></div>
    </div>
    ${cards ? `<div class="row wrap" style="margin-top:10px;gap:6px">${boxes.map((n,i)=>`<span class="tag" title="Leitner box ${i+1}">Box ${i+1} · ${n}</span>`).join('')}</div>` : ''}
    <div style="margin-top:14px">
      <div class="k" style="color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Topics</div>
      <div class="list" style="margin-top:6px;max-height:150px;overflow:auto">
        ${s.topics.length ? [...s.topics].sort((a,b)=>a.done-b.done||b.difficulty-a.difficulty).map(t=>`
          <div class="item ${t.done?'done':''}"><span>${t.done?'✅':'◻️'}</span>
            <div class="grow"><div class="title">${esc(t.name)}</div></div>
            <span class="tag">${DIFF_LABEL[t.difficulty]}</span></div>`).join('')
        : '<p class="sub">No topics yet — open ✎ Edit to add the syllabus.</p>'}
      </div>
    </div>
    <div class="grid g3" style="margin-top:12px">
      <div>
        <div class="k" style="color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Open tasks</div>
        ${openTasks.length ? openTasks.map(t=>`
          <div class="item"><span>📅</span><div class="grow"><div class="title">${esc(t.title)}</div></div>
            <span class="tag">${fmtDayShort(t.date)}</span><span class="tag">${fmtMin(t.minutes)}</span></div>`).join('')
        : '<p class="sub" style="margin-top:6px">None — everything done 🎉</p>'}
      </div>
      <div>
        <div class="k" style="color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Recent sessions</div>
        ${sessions.length ? sessions.slice(-4).reverse().map(x=>`
          <div class="item"><span>⏱️</span><div class="grow"><div class="title">${fmtDayShort(todayISO(new Date(x.at)))}</div></div>
            <span class="tag">${fmtMin(x.minutes)}</span></div>`).join('')
        : '<p class="sub" style="margin-top:6px">No sessions logged yet.</p>'}
      </div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:16px;gap:8px">
      <button class="btn ghost" data-act="modal-close">Close</button>
      <button class="btn ghost" data-act="edit-subject" data-id="${s.id}">✎ Edit</button>
      ${due ? `<button class="btn" data-act="detail-study-cards" data-id="${s.id}">🧠 ${due} cards due</button>` : ''}
